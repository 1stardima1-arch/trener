<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Тренер — офлайн</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #eaf2ff 0%, #f4f0ff 50%, #eef7ec 100%);
      color: #0b0b12;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 360px;
      box-shadow: 0 12px 32px rgba(11, 11, 18, 0.08);
    }
    .orb {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: conic-gradient(from 40deg, #ff8a5c, #ff5f9e, #b06bff, #5a8dff, #64d8ff, #7dffb2, #ff8a5c);
      animation: spin 7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #4a4a58; font-size: 0.95rem; line-height: 1.5; margin: 0 0 24px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #4f6bff, #8b5cf6);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="orb"></div>
    <h1>Нет соединения</h1>
    <p>Похоже, интернет пропал. Проверь связь — план и показатели никуда не делись.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </div>
</body>
</html>
