<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sphereBase" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#64d8ff" />
      <stop offset="28%" stop-color="#5a8dff" />
      <stop offset="55%" stop-color="#b06bff" />
      <stop offset="78%" stop-color="#ff5f9e" />
      <stop offset="100%" stop-color="#ff8a5c" />
    </radialGradient>
    <radialGradient id="sphereShade" cx="68%" cy="72%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#1a0630" stop-opacity="0.38" />
    </radialGradient>
    <radialGradient id="gloss" cx="32%" cy="24%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e7e6f2" />
    </linearGradient>
    <linearGradient id="capBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f3fb" />
      <stop offset="100%" stop-color="#c9c7db" />
    </linearGradient>
    <radialGradient id="tuft" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe9a8" />
      <stop offset="100%" stop-color="#f5b93f" />
    </radialGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10.24" />
    </filter>
    <filter id="shadowBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="17.92" />
    </filter>
  </defs>

  

  <!-- ambient dark backdrop glow so the sphere doesn't float on nothing,
       matching the splash screen's dark gradient field -->
  <rect width="512" height="512" rx="112.64" fill="#0b0b14" />

  <!-- soft ground shadow beneath the sphere -->
  <ellipse cx="256" cy="425.57439999999997" rx="156.672" ry="40.550399999999996" fill="#000000" opacity="0.35" filter="url(#shadowBlur)" />

  <!-- the sphere itself -->
  <circle cx="256" cy="256" r="184.32" fill="url(#sphereBase)" />
  <circle cx="256" cy="256" r="184.32" fill="url(#sphereShade)" />
  <circle cx="256" cy="256" r="184.32" fill="url(#gloss)" />

  <!-- graduation cap emblem: board + dome + tassel, each with its own
       light/dark edge for embossed relief -->
  <g>
    <ellipse cx="256" cy="292.163584" rx="94.0032" ry="47.0016" fill="url(#capBase)" />
    <polygon
      points="256,175.599616 394.24,233.8816 256,292.163584 117.75999999999999,233.8816"
      fill="url(#capTop)"
    />
    <polygon
      points="256,175.599616 394.24,233.8816 256,243.28191999999999"
      fill="#ffffff"
      opacity="0.55"
    />
    <path
      d="M 272.5888 241.40185599999998 C 311.296 285.58335999999997, 289.1776 341.98528, 261.5296 360.78592000000003"
      stroke="url(#tuft)"
      stroke-width="7.168"
      fill="none"
      stroke-linecap="round"
    />
    <circle cx="261.5296" cy="365.48608" r="14.336" fill="url(#tuft)" />
  </g>
</svg>